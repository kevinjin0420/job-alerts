<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>job-alerts dashboard - metrics</title>
<script>
  (function() {
    var stored = localStorage.getItem("job-alerts-theme");
    var isDark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.classList.toggle("dark", isDark);
  })();
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: "class" };</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"
  integrity="sha512-Y51n9mtKTVBh3Jbx5pZSJNDDMyY+yGe77DGtBPzRlgsf/YLCh13kSZ3JmfHGzYFCmOndraf0sQgfM654b7dJ3w=="
  crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background-color: rgb(212 212 212); border-radius: 9999px; border: 2px solid transparent; background-clip: content-box; }
  html { scrollbar-color: rgb(212 212 212) transparent; scrollbar-width: thin; }
  @media (prefers-color-scheme: dark) {
    ::-webkit-scrollbar-thumb { background-color: rgb(64 64 64); }
    html { scrollbar-color: rgb(64 64 64) transparent; }
  }

  /* Chart color roles - see the dataviz skill's palette.md. Dark values swap via
     the .dark class this dashboard already toggles, not a media query, since
     that's the mechanism the rest of the app uses. */
  .viz-root {
    --chart-gridline: #e1e0d9;
    --chart-axis: #898781;
    --chart-baseline: #c3c2b7;
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --series-3: #1baf7a;
  }
  .dark .viz-root {
    --chart-gridline: #2c2c2a;
    --chart-axis: #898781;
    --chart-baseline: #383835;
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
  }
</style>
</head>
<body class="bg-neutral-50 dark:bg-neutral-950 text-neutral-900 dark:text-neutral-100 min-h-screen">

<div id="gate" class="min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-sm rounded-none border border-neutral-300 dark:border-neutral-800 bg-white dark:bg-neutral-900 p-6">
    <h1 class="text-sm font-semibold tracking-wide uppercase text-center">job-alerts</h1>
    <p class="mt-1 text-sm text-neutral-500 dark:text-neutral-500 text-center">Sign in to continue</p>
    <div id="login-error" class="mt-3 text-sm hidden"></div>
    <input type="email" id="email-input" placeholder="Email"
      class="mt-4 w-full rounded-none border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-neutral-500">
    <input type="password" id="password-input" placeholder="Password"
      class="mt-3 w-full rounded-none border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-neutral-500">
    <input type="password" id="new-password-input" placeholder="New password"
      class="hidden mt-3 w-full rounded-none border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-neutral-500">
    <button id="login-btn"
      class="mt-3 w-full rounded-none bg-neutral-900 hover:opacity-50 dark:bg-neutral-100 text-white dark:text-neutral-900 text-sm font-medium px-3 py-1.5">
      Sign in
    </button>
  </div>
</div>

<div id="app" class="hidden flex min-h-screen">
__SIDEBAR__

  <main class="flex-1 p-6">
    <div class="flex items-baseline justify-between mb-6">
      <h2 class="text-xs font-semibold tracking-widest uppercase text-neutral-500 dark:text-neutral-500">Metrics &middot; last 24h</h2>
      <button id="refresh-btn"
        class="text-xs px-3 py-1.5 rounded-none border border-neutral-300 dark:border-neutral-700 hover:bg-neutral-100 dark:hover:bg-neutral-900">
        Refresh
      </button>
    </div>

    <div id="metric-sections" class="space-y-8"></div>

    <section class="mt-8">
      <h3 class="text-xs font-semibold tracking-widest uppercase text-neutral-500 dark:text-neutral-500 mb-3">Charts</h3>
      <div class="grid gap-6 xl:grid-cols-2">
        <figure id="chart-duration" class="viz-root border border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-900 px-4 py-4"></figure>
        <figure id="chart-backlog" class="viz-root border border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-900 px-4 py-4"></figure>
        <figure id="chart-throughput" class="viz-root border border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-900 px-4 py-4 xl:col-span-2"></figure>
      </div>
    </section>
  </main>
</div>

<script src="/shared.js"></script>
<script>
// matches aws/config.env's SCHEDULE_RATE
const SCHEDULE_INTERVAL_SECONDS = 300;
let nextRunAt = null;

function formatLocalDate(value) {
  const date = new Date(value);
  const pad = (n) => String(n).padStart(2, "0");
  return `${date.getFullYear()}/${pad(date.getMonth() + 1)}/${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
}

async function showApp() {
  showAppShell();
  await setupNav();
  loadMetrics();
}

document.getElementById("refresh-btn").addEventListener("click", loadMetrics);

function formatNumber(value) {
  return value === null || value === undefined ? "-" : value;
}

function formatPercent(numerator, denominator) {
  if (!denominator) return "-";
  return `${((numerator / denominator) * 100).toFixed(1)}%`;
}

function buildSections(metrics, listingCounts) {
  nextRunAt = metrics.last_ran ? new Date(metrics.last_ran).getTime() + SCHEDULE_INTERVAL_SECONDS * 1000 : null;
  return [
    {
      title: "Schedule",
      cards: [
        ["Last ran", metrics.last_ran ? formatLocalDate(metrics.last_ran) : "-"],
        ["Next scheduled run", nextRunAt ? formatLocalDate(nextRunAt) : "-"],
      ],
    },
    {
      title: "Execution",
      cards: [
        ["Invocations", formatNumber(metrics.invocations_24h)],
        ["Errors", formatNumber(metrics.errors_24h)],
        ["Success rate", formatPercent(metrics.invocations_24h - metrics.errors_24h, metrics.invocations_24h)],
        ["Avg duration (ms)", formatNumber(metrics.avg_duration_ms)],
      ],
    },
    {
      title: "Listings",
      cards: [
        ["Total tracked", formatNumber(listingCounts.total)],
        ["Notified", formatNumber(listingCounts.notified)],
        ["Dismissed", formatNumber(listingCounts.dismissed)],
        ["Seeded (first run)", formatNumber(listingCounts.seeded)],
      ],
    },
  ];
}

function countListingsByStatus(listings) {
  const counts = { total: listings.length, notified: 0, dismissed: 0, seeded: 0 };
  for (const item of listings) {
    if (item.status in counts) counts[item.status] += 1;
  }
  return counts;
}

function renderMessage(container, text, extraClass) {
  container.innerHTML = `<div class="border border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-900 px-4 py-6 text-sm ${extraClass}">${text}</div>`;
}

function chartColors() {
  const styles = getComputedStyle(document.querySelector(".viz-root"));
  return {
    grid: styles.getPropertyValue("--chart-gridline").trim(),
    axis: styles.getPropertyValue("--chart-axis").trim(),
    baseline: styles.getPropertyValue("--chart-baseline").trim(),
    series1: styles.getPropertyValue("--series-1").trim(),
    series2: styles.getPropertyValue("--series-2").trim(),
    series3: styles.getPropertyValue("--series-3").trim(),
  };
}

// Chart.js ships hover highlighting/tooltips but no crosshair line - this is the
// standard way to add one: draw a hairline at the nearest active point's x on
// every redraw. interaction.mode "index" (set per-chart) already finds that
// nearest point for us; this just draws the line interaction.md asks for.
const crosshairPlugin = {
  id: "crosshair",
  afterDatasetsDraw(chart) {
    const active = chart.getActiveElements();
    if (!active.length) return;
    const { ctx, chartArea } = chart;
    const x = active[0].element.x;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(x, chartArea.top);
    ctx.lineTo(x, chartArea.bottom);
    ctx.lineWidth = 1;
    ctx.strokeStyle = chartColors().baseline;
    ctx.stroke();
    ctx.restore();
  },
};
Chart.register(crosshairPlugin);

function formatTimeTick(iso) {
  const date = new Date(iso);
  const pad = (n) => String(n).padStart(2, "0");
  return `${pad(date.getHours())}:${pad(date.getMinutes())}`;
}

// Chart.js has no built-in accessible/no-JS equivalent - this table is that twin,
// toggled in alongside the canvas (see renderChartCard).
function buildTableView(series, data) {
  const table = document.createElement("table");
  table.className = "w-full text-xs";
  const headRow = document.createElement("tr");
  const timeHead = document.createElement("th");
  timeHead.className = "text-left font-medium text-neutral-500 dark:text-neutral-500 pb-2 pr-4";
  timeHead.textContent = "Time";
  headRow.appendChild(timeHead);
  for (const s of series) {
    const th = document.createElement("th");
    th.className = "text-right font-medium text-neutral-500 dark:text-neutral-500 pb-2 pl-4";
    th.textContent = s.label;
    headRow.appendChild(th);
  }
  const thead = document.createElement("thead");
  thead.appendChild(headRow);
  table.appendChild(thead);

  const tbody = document.createElement("tbody");
  for (const point of data) {
    const row = document.createElement("tr");
    const timeCell = document.createElement("td");
    timeCell.className = "py-1 pr-4 font-mono";
    timeCell.textContent = formatLocalDate(point.timestamp);
    row.appendChild(timeCell);
    for (const s of series) {
      const cell = document.createElement("td");
      cell.className = "py-1 pl-4 text-right font-mono";
      cell.textContent = String(point[s.key] ?? "-");
      row.appendChild(cell);
    }
    tbody.appendChild(row);
  }
  table.appendChild(tbody);
  return table;
}

const chartInstances = {};

function renderChartCard(id, title, series, data, options = {}) {
  const figureEl = document.getElementById(id);
  figureEl.innerHTML = "";
  if (chartInstances[id]) {
    chartInstances[id].destroy();
    delete chartInstances[id];
  }

  const header = document.createElement("div");
  header.className = "flex items-center justify-between mb-3";
  const heading = document.createElement("h4");
  heading.className = "text-xs font-semibold tracking-widest uppercase text-neutral-500 dark:text-neutral-500";
  heading.textContent = title;
  header.appendChild(heading);
  figureEl.appendChild(header);

  if (!data.length) {
    const empty = document.createElement("div");
    empty.className = "text-sm text-neutral-500 dark:text-neutral-500 py-6";
    empty.textContent = "No data in the selected window";
    figureEl.appendChild(empty);
    return;
  }

  const toggle = document.createElement("button");
  toggle.type = "button";
  toggle.className = "text-xs px-2 py-1 rounded-none border border-neutral-300 dark:border-neutral-700 hover:bg-neutral-100 dark:hover:bg-neutral-900";
  toggle.textContent = "View as table";
  header.appendChild(toggle);

  const canvasWrapper = document.createElement("div");
  canvasWrapper.className = "h-56";
  const canvas = document.createElement("canvas");
  canvasWrapper.appendChild(canvas);
  figureEl.appendChild(canvasWrapper);

  const tableWrapper = document.createElement("div");
  tableWrapper.className = "hidden overflow-x-auto";
  tableWrapper.appendChild(buildTableView(series, data));
  figureEl.appendChild(tableWrapper);

  let showingTable = false;
  toggle.addEventListener("click", () => {
    showingTable = !showingTable;
    canvasWrapper.classList.toggle("hidden", showingTable);
    tableWrapper.classList.toggle("hidden", !showingTable);
    toggle.textContent = showingTable ? "View as chart" : "View as table";
  });

  const colors = chartColors();
  const yFormat = options.yFormat || ((value) => value);
  chartInstances[id] = new Chart(canvas, {
    type: "line",
    data: {
      labels: data.map((point) => formatTimeTick(point.timestamp)),
      datasets: series.map((s) => ({
        label: s.label,
        data: data.map((point) => Number(point[s.key]) || 0),
        borderColor: s.color,
        backgroundColor: s.color,
        borderWidth: 2,
        pointRadius: 0,
        pointHoverRadius: 4,
        pointHitRadius: 12,
        tension: 0,
      })),
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { display: series.length > 1, labels: { color: colors.axis, usePointStyle: true, boxWidth: 8 } },
        tooltip: {
          usePointStyle: true,
          callbacks: {
            title: (items) => formatLocalDate(data[items[0].dataIndex].timestamp),
            label: (item) => `${yFormat(item.parsed.y)}  ${item.dataset.label}`,
          },
        },
      },
      scales: {
        x: {
          border: { color: colors.baseline },
          grid: { color: colors.grid },
          ticks: { color: colors.axis, autoSkip: true, maxTicksLimit: 6, maxRotation: 0 },
          title: { display: true, text: "Time", color: colors.axis, font: { size: 11 } },
        },
        y: {
          beginAtZero: true,
          border: { color: colors.baseline },
          grid: { color: colors.grid },
          ticks: { color: colors.axis, callback: (value) => yFormat(value) },
          title: { display: !!options.yAxisLabel, text: options.yAxisLabel || "", color: colors.axis, font: { size: 11 } },
        },
      },
    },
  });
}

function renderCharts(metrics) {
  const colors = chartColors();
  renderChartCard(
    "chart-duration", "Duration",
    [{ key: "value", label: "Duration (ms)", color: colors.series1 }],
    metrics.duration_series || [],
    { yFormat: (value) => `${Math.round(value)}ms`, yAxisLabel: "Duration (ms)" },
  );
  renderChartCard(
    "chart-backlog", "Classifier backlog",
    [{ key: "count", label: "Uncached listings", color: colors.series2 }],
    metrics.backlog_series || [],
    { yFormat: (value) => Math.round(value), yAxisLabel: "Listings" },
  );
  renderChartCard(
    "chart-throughput", "Listings processed",
    [
      { key: "new", label: "New", color: colors.series1 },
      { key: "notified", label: "Notified", color: colors.series2 },
      { key: "dismissed", label: "Dismissed", color: colors.series3 },
    ],
    metrics.throughput_series || [],
    { yFormat: (value) => Math.round(value), yAxisLabel: "Listings" },
  );
}

async function loadMetrics() {
  const container = document.getElementById("metric-sections");
  renderMessage(container, "Loading…", "text-neutral-500 dark:text-neutral-500");
  let metrics, listingCounts;
  try {
    const [metricsResponse, listingsResponse] = await Promise.all([
      apiFetch("/api/metrics"),
      apiFetch("/api/listings"),
    ]);
    metrics = await metricsResponse.json();
    const { listings } = await listingsResponse.json();
    listingCounts = countListingsByStatus(listings);
  } catch (error) {
    renderMessage(container, "Failed to load metrics", "text-red-600 dark:text-red-400");
    return;
  }
  container.innerHTML = "";
  for (const section of buildSections(metrics, listingCounts)) {
    const wrapper = document.createElement("section");
    const grid = document.createElement("div");
    grid.className = "grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-5 gap-px bg-neutral-200 dark:bg-neutral-800 border border-neutral-200 dark:border-neutral-800";
    for (const [label, value] of section.cards) {
      const card = document.createElement("div");
      card.className = "bg-white dark:bg-neutral-900 px-4 py-4";
      card.innerHTML = `
        <div class="text-xs text-neutral-500 dark:text-neutral-500">${label}</div>
        <div class="text-2xl font-mono mt-1">${value}</div>
      `;
      grid.appendChild(card);
    }
    wrapper.innerHTML = `<h3 class="text-xs font-semibold tracking-widest uppercase text-neutral-500 dark:text-neutral-500 mb-3">${section.title}</h3>`;
    wrapper.appendChild(grid);
    container.appendChild(wrapper);
  }
  renderCharts(metrics);
}

if (token()) {
  showApp();
} else {
  showGate();
}

setInterval(() => { if (token()) loadMetrics(); }, 60000);

// Chart colors are read once at render time (canvas can't resolve CSS var()
// on its own), so a theme flip needs a re-render to pick up the new palette.
document.getElementById("theme-toggle-btn").addEventListener("click", () => {
  if (token()) loadMetrics();
});
</script>

</body>
</html>
