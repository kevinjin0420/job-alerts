<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>job-alerts dashboard - metrics</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: "media" };</script>
<style>
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background-color: rgb(212 212 212); border-radius: 9999px; border: 2px solid transparent; background-clip: content-box; }
  html { scrollbar-color: rgb(212 212 212) transparent; scrollbar-width: thin; }
  @media (prefers-color-scheme: dark) {
    ::-webkit-scrollbar-thumb { background-color: rgb(64 64 64); }
    html { scrollbar-color: rgb(64 64 64) transparent; }
  }
</style>
</head>
<body class="bg-neutral-50 dark:bg-neutral-950 text-neutral-900 dark:text-neutral-100 min-h-screen">

<div id="gate" class="min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-sm rounded-sm border border-neutral-300 dark:border-neutral-800 bg-white dark:bg-neutral-900 p-6">
    <h1 class="text-sm font-semibold tracking-wide uppercase text-center">job-alerts</h1>
    <p class="mt-1 text-sm text-neutral-500 dark:text-neutral-500 text-center">Sign in to continue</p>
    <div id="login-error" class="mt-3 text-sm hidden"></div>
    <input type="email" id="email-input" placeholder="Email"
      class="mt-4 w-full rounded-sm border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-neutral-500">
    <input type="password" id="password-input" placeholder="Password"
      class="mt-3 w-full rounded-sm border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-neutral-500">
    <input type="password" id="new-password-input" placeholder="New password"
      class="hidden mt-3 w-full rounded-sm border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-neutral-500">
    <button id="login-btn"
      class="mt-3 w-full rounded-sm bg-neutral-900 hover:bg-neutral-700 dark:bg-neutral-100 dark:hover:bg-neutral-300 text-white dark:text-neutral-900 text-sm font-medium px-3 py-1.5">
      Sign in
    </button>
  </div>
</div>

<div id="app" class="hidden flex min-h-screen">
  <aside class="w-52 shrink-0 border-r border-neutral-200 dark:border-neutral-800 p-3">
    <div class="text-xs font-semibold tracking-widest uppercase mb-8">job-alerts</div>
    <nav class="flex flex-col gap-1 text-sm">
      <a href="/metrics" class="px-3 py-2 rounded-sm font-medium bg-neutral-900 text-white dark:bg-neutral-100 dark:text-neutral-900">Metrics</a>
      <a href="/listings" class="px-3 py-2 rounded-sm text-neutral-600 hover:bg-neutral-100 dark:text-neutral-400 dark:hover:bg-neutral-900">Listings</a>
      <a href="/config" class="px-3 py-2 rounded-sm text-neutral-600 hover:bg-neutral-100 dark:text-neutral-400 dark:hover:bg-neutral-900">Config</a>
      <a href="/profile" class="px-3 py-2 rounded-sm text-neutral-600 hover:bg-neutral-100 dark:text-neutral-400 dark:hover:bg-neutral-900">Profile</a>
      <a href="/logs" id="logs-nav-link" class="hidden px-3 py-2 rounded-sm text-neutral-600 hover:bg-neutral-100 dark:text-neutral-400 dark:hover:bg-neutral-900">Logs</a>
      <a href="/sources" id="sources-nav-link" class="hidden px-3 py-2 rounded-sm text-neutral-600 hover:bg-neutral-100 dark:text-neutral-400 dark:hover:bg-neutral-900">Sources</a>
      <a href="/admin" id="admin-nav-link" class="hidden px-3 py-2 rounded-sm text-neutral-600 hover:bg-neutral-100 dark:text-neutral-400 dark:hover:bg-neutral-900">Admin</a>
    </nav>
  </aside>

  <main class="flex-1 p-6">
    <div class="flex items-baseline justify-between mb-6">
      <h2 class="text-xs font-semibold tracking-widest uppercase text-neutral-500 dark:text-neutral-500">Metrics &middot; last 24h</h2>
      <button id="refresh-btn"
        class="text-xs px-3 py-1.5 rounded-sm border border-neutral-300 dark:border-neutral-700 hover:bg-neutral-100 dark:hover:bg-neutral-900">
        Refresh
      </button>
    </div>

    <div id="metric-sections" class="space-y-8"></div>
  </main>
</div>

<script>
const TOKEN_STORAGE = "job-alerts-access-token";
let pendingSession = null;

function token() {
  return localStorage.getItem(TOKEN_STORAGE) || "";
}

// matches aws/config.env's SCHEDULE_RATE
const SCHEDULE_INTERVAL_SECONDS = 300;
let nextRunAt = null;

function formatLocalDate(value) {
  const date = new Date(value);
  const pad = (n) => String(n).padStart(2, "0");
  return `${date.getFullYear()}/${pad(date.getMonth() + 1)}/${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
}

async function apiFetch(path, options = {}) {
  const response = await fetch(path, {
    ...options,
    headers: { ...(options.headers || {}), "Authorization": `Bearer ${token()}` },
  });
  if (response.status === 401) {
    localStorage.removeItem(TOKEN_STORAGE);
    showGate();
    throw new Error("unauthorized");
  }
  return response;
}

function showGate() {
  document.getElementById("gate").classList.remove("hidden");
  document.getElementById("app").classList.add("hidden");
}

async function setupNav() {
  try {
    const response = await apiFetch("/api/me");
    const me = await response.json();
    document.getElementById("admin-nav-link").classList.toggle("hidden", !me.is_admin);
    document.getElementById("logs-nav-link").classList.toggle("hidden", !me.is_admin);
    document.getElementById("sources-nav-link").classList.toggle("hidden", !me.is_admin);
  } catch (error) {
    // apiFetch already shows the gate on 401
  }
}

async function showApp() {
  document.getElementById("gate").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  await setupNav();
  loadMetrics();
}

document.getElementById("login-btn").addEventListener("click", async () => {
  const errorEl = document.getElementById("login-error");
  errorEl.classList.add("hidden");
  const email = document.getElementById("email-input").value.trim();

  const body = pendingSession
    ? { email, new_password: document.getElementById("new-password-input").value, session: pendingSession }
    : { email, password: document.getElementById("password-input").value };

  const response = await fetch("/api/login", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await response.json();

  if (!response.ok) {
    errorEl.textContent = data.error || "Login failed";
    errorEl.className = "mt-3 text-sm text-red-600 dark:text-red-400";
    return;
  }
  if (data.challenge === "NEW_PASSWORD_REQUIRED") {
    pendingSession = data.session;
    document.getElementById("password-input").classList.add("hidden");
    document.getElementById("new-password-input").classList.remove("hidden");
    errorEl.textContent = "First login - please set a new password";
    errorEl.className = "mt-3 text-sm text-neutral-600 dark:text-neutral-400";
    return;
  }
  localStorage.setItem(TOKEN_STORAGE, data.access_token);
  showApp();
});

document.getElementById("refresh-btn").addEventListener("click", loadMetrics);

function formatNumber(value) {
  return value === null || value === undefined ? "-" : value;
}

function formatPercent(numerator, denominator) {
  if (!denominator) return "-";
  return `${((numerator / denominator) * 100).toFixed(1)}%`;
}

function buildSections(metrics) {
  nextRunAt = metrics.last_ran ? new Date(metrics.last_ran).getTime() + SCHEDULE_INTERVAL_SECONDS * 1000 : null;
  return [
    {
      title: "Execution",
      cards: [
        ["Invocations", formatNumber(metrics.invocations_24h)],
        ["Errors", formatNumber(metrics.errors_24h)],
        ["Success rate", formatPercent(metrics.invocations_24h - metrics.errors_24h, metrics.invocations_24h)],
        ["Avg duration (ms)", formatNumber(metrics.avg_duration_ms)],
        ["Last ran", metrics.last_ran ? formatLocalDate(metrics.last_ran) : "-"],
        ["Next scheduled run", nextRunAt ? formatLocalDate(nextRunAt) : "-"],
      ],
    },
    {
      title: "Your usage",
      cards: [
        ["Classifier calls this month", formatNumber(metrics.classifier_calls_this_month)],
      ],
    },
  ];
}

function renderMessage(container, text, extraClass) {
  container.innerHTML = `<div class="border border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-900 px-4 py-6 text-sm ${extraClass}">${text}</div>`;
}

async function loadMetrics() {
  const container = document.getElementById("metric-sections");
  renderMessage(container, "Loading…", "text-neutral-500 dark:text-neutral-500");
  let metrics;
  try {
    const response = await apiFetch("/api/metrics");
    metrics = await response.json();
  } catch (error) {
    renderMessage(container, "Failed to load metrics", "text-red-600 dark:text-red-400");
    return;
  }
  container.innerHTML = "";
  for (const section of buildSections(metrics)) {
    const wrapper = document.createElement("section");
    const grid = document.createElement("div");
    grid.className = "grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-5 gap-px bg-neutral-200 dark:bg-neutral-800 border border-neutral-200 dark:border-neutral-800";
    for (const [label, value] of section.cards) {
      const card = document.createElement("div");
      card.className = "bg-white dark:bg-neutral-900 px-4 py-4";
      card.innerHTML = `
        <div class="text-xs text-neutral-500 dark:text-neutral-500">${label}</div>
        <div class="text-2xl font-mono mt-1">${value}</div>
      `;
      grid.appendChild(card);
    }
    wrapper.innerHTML = `<h3 class="text-xs font-semibold tracking-widest uppercase text-neutral-500 dark:text-neutral-500 mb-3">${section.title}</h3>`;
    wrapper.appendChild(grid);
    container.appendChild(wrapper);
  }
}

if (token()) {
  showApp();
} else {
  showGate();
}

setInterval(() => { if (token()) loadMetrics(); }, 60000);
</script>

</body>
</html>
