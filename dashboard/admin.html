<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>job-alerts dashboard - admin</title>
<script>
  (function() {
    var stored = localStorage.getItem("job-alerts-theme");
    var isDark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.classList.toggle("dark", isDark);
  })();
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: "class" };</script>
<style>
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background-color: rgb(212 212 212); border-radius: 9999px; border: 2px solid transparent; background-clip: content-box; }
  html { scrollbar-color: rgb(212 212 212) transparent; scrollbar-width: thin; }
  @media (prefers-color-scheme: dark) {
    ::-webkit-scrollbar-thumb { background-color: rgb(64 64 64); }
    html { scrollbar-color: rgb(64 64 64) transparent; }
  }
</style>
</head>
<body class="bg-neutral-50 dark:bg-neutral-950 text-neutral-900 dark:text-neutral-100 min-h-screen">

<div id="gate" class="min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-sm rounded-none border border-neutral-300 dark:border-neutral-800 bg-white dark:bg-neutral-900 p-6">
    <h1 class="text-sm font-semibold tracking-wide uppercase text-center">job-alerts</h1>
    <p class="mt-1 text-sm text-neutral-500 dark:text-neutral-500 text-center">Sign in to continue</p>
    <div id="login-error" class="mt-3 text-sm hidden"></div>
    <input type="email" id="email-input" placeholder="Email"
      class="mt-4 w-full rounded-none border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-neutral-500">
    <input type="password" id="password-input" placeholder="Password"
      class="mt-3 w-full rounded-none border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-neutral-500">
    <input type="password" id="new-password-input" placeholder="New password"
      class="hidden mt-3 w-full rounded-none border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-neutral-500">
    <button id="login-btn"
      class="mt-3 w-full rounded-none bg-neutral-900 hover:opacity-50 dark:bg-neutral-100 text-white dark:text-neutral-900 text-sm font-medium px-3 py-1.5">
      Sign in
    </button>
  </div>
</div>

<div id="app" class="hidden flex min-h-screen">
__SIDEBAR__

  <main class="flex-1 p-6">
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-xs font-semibold tracking-widest uppercase text-neutral-500 dark:text-neutral-500">Users</h2>
      <button id="refresh-btn"
        class="text-xs px-3 py-1.5 rounded-none border border-neutral-300 dark:border-neutral-700 hover:bg-neutral-100 dark:hover:bg-neutral-900">
        Refresh
      </button>
    </div>

    <div class="max-w-md border border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-900 p-3 mb-6">
      <label class="block text-xs font-medium uppercase tracking-wide text-neutral-500 dark:text-neutral-500 mb-2">Invite a user</label>
      <div class="flex gap-3">
        <input type="email" id="new-user-email" placeholder="friend@example.com"
          class="flex-1 rounded-none border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-neutral-500">
        <button id="add-user-btn"
          class="rounded-none bg-neutral-900 hover:opacity-50 dark:bg-neutral-100 text-white dark:text-neutral-900 text-sm font-medium px-3 py-1.5">
          Invite
        </button>
      </div>
      <p id="add-user-status" class="mt-2 text-sm text-neutral-500 dark:text-neutral-500"></p>
    </div>

    <div id="users-table" class="border border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-900 mb-10"></div>

    <h2 class="text-xs font-semibold tracking-widest uppercase text-neutral-500 dark:text-neutral-500 mb-6">Global settings</h2>
    <div class="max-w-md border border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-900 p-3">
      <label class="block text-xs font-medium uppercase tracking-wide text-neutral-500 dark:text-neutral-500 mb-2">Classifier model</label>
      <div class="flex gap-3">
        <input type="text" id="classifier-model" placeholder="qwen/qwen3.6-flash"
          class="flex-1 rounded-none border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-3 py-2 text-sm font-mono focus:outline-none focus:ring-1 focus:ring-neutral-500">
        <button id="save-classifier-model-btn"
          class="rounded-none bg-neutral-900 hover:opacity-50 dark:bg-neutral-100 text-white dark:text-neutral-900 text-sm font-medium px-3 py-1.5">
          Save
        </button>
      </div>
      <p id="classifier-model-status" class="mt-2 text-sm text-neutral-500 dark:text-neutral-500"></p>
    </div>

    <div class="max-w-md border border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-900 p-3 mt-6">
      <label class="block text-xs font-medium uppercase tracking-wide text-neutral-500 dark:text-neutral-500 mb-2">Scan</label>
      <div class="flex items-center gap-3">
        <button id="trigger-scan-btn"
          class="rounded-none bg-neutral-900 hover:opacity-50 dark:bg-neutral-100 text-white dark:text-neutral-900 text-sm font-medium px-3 py-1.5">
          Run scan now
        </button>
        <p id="trigger-scan-status" class="text-sm text-neutral-500 dark:text-neutral-500"></p>
      </div>
    </div>
  </main>
</div>

<script src="/shared.js"></script>
<script>
async function showApp() {
  showAppShell();
  if (!(await requireAdmin())) return;
  loadUsers();
  loadClassifierModel();
}

document.getElementById("refresh-btn").addEventListener("click", () => {
  loadUsers();
});

async function loadClassifierModel() {
  const response = await apiFetch("/api/admin/settings");
  const data = await response.json();
  document.getElementById("classifier-model").value = data.classifier_model || "";
}

document.getElementById("save-classifier-model-btn").addEventListener("click", async () => {
  const status = document.getElementById("classifier-model-status");
  const classifier_model = document.getElementById("classifier-model").value.trim();
  if (!classifier_model) {
    status.textContent = "Enter a model first";
    return;
  }
  status.textContent = "Saving...";
  try {
    const response = await apiFetch("/api/admin/settings", {
      method: "PUT",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ classifier_model }),
    });
    if (!response.ok) {
      const data = await response.json();
      status.textContent = data.error || "Failed to save";
      return;
    }
    status.textContent = "Saved";
  } catch (error) {
    status.textContent = "Failed to save";
  }
  setTimeout(() => { status.textContent = ""; }, 3000);
});

document.getElementById("trigger-scan-btn").addEventListener("click", async (event) => {
  const button = event.currentTarget;
  const status = document.getElementById("trigger-scan-status");
  button.disabled = true;
  status.textContent = "Triggering...";
  try {
    const response = await apiFetch("/api/admin/trigger-scan", { method: "POST" });
    status.textContent = response.ok ? "Scan triggered - check Logs in a few seconds" : "Failed to trigger scan";
  } catch (error) {
    status.textContent = "Failed to trigger scan";
  }
  button.disabled = false;
  setTimeout(() => { status.textContent = ""; }, 5000);
});

document.getElementById("add-user-btn").addEventListener("click", async () => {
  const status = document.getElementById("add-user-status");
  const emailInput = document.getElementById("new-user-email");
  const email = emailInput.value.trim();
  if (!email) return;
  status.textContent = "Inviting...";
  try {
    await apiFetch("/api/admin/users", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ email }),
    });
    status.textContent = `Invited ${email}`;
    emailInput.value = "";
    loadUsers();
  } catch (error) {
    status.textContent = "Failed to invite user";
  }
});

function renderMessage(container, text, extraClass) {
  container.innerHTML = `<div class="px-4 py-6 text-sm ${extraClass}">${text}</div>`;
}

async function loadUsers() {
  const container = document.getElementById("users-table");
  renderMessage(container, "Loading…", "text-neutral-500 dark:text-neutral-500");
  let users;
  try {
    const response = await apiFetch("/api/admin/users");
    ({ users } = await response.json());
  } catch (error) {
    renderMessage(container, "Failed to load users", "text-red-600 dark:text-red-400");
    return;
  }
  if (users.length === 0) {
    renderMessage(container, "No users yet", "text-neutral-500 dark:text-neutral-500");
    return;
  }

  const table = document.createElement("table");
  table.className = "w-full text-sm";
  table.innerHTML = `
    <thead>
      <tr class="border-b border-neutral-200 dark:border-neutral-800 text-left text-xs uppercase tracking-wide text-neutral-500 dark:text-neutral-500">
        <th class="px-3 py-2 font-medium">Email</th>
        <th class="px-3 py-2 font-medium">Role</th>
        <th class="px-3 py-2 font-medium">Calls this month</th>
        <th class="px-3 py-2 font-medium">ntfy topic</th>
        <th class="px-3 py-2 font-medium"></th>
      </tr>
    </thead>
  `;
  const tbody = document.createElement("tbody");
  for (const user of users) {
    const row = document.createElement("tr");
    row.className = "border-b border-neutral-100 dark:border-neutral-900 last:border-0";
    row.innerHTML = `
      <td class="px-3 py-2 font-mono">${user.user_id}</td>
      <td class="px-3 py-2">${user.is_admin ? "Admin" : "User"}</td>
      <td class="px-3 py-2 font-mono">${user.monthly_classifier_calls}</td>
      <td class="px-3 py-2 font-mono">${user.ntfy_topic || "-"}</td>
      <td class="px-3 py-2 text-right"></td>
    `;
    if (!user.is_admin) {
      const removeBtn = document.createElement("button");
      removeBtn.textContent = "Remove";
      removeBtn.className = "text-xs px-2 py-1 rounded-none border border-red-200 dark:border-red-900 text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-950";
      removeBtn.addEventListener("click", () => removeUser(user.user_id));
      row.lastElementChild.appendChild(removeBtn);
    }
    tbody.appendChild(row);
  }
  table.appendChild(tbody);
  container.innerHTML = "";
  container.appendChild(table);
}

async function removeUser(userId) {
  await apiFetch(`/api/admin/users/${encodeURIComponent(userId)}`, { method: "DELETE" });
  loadUsers();
}

if (token()) {
  showApp();
} else {
  showGate();
}
</script>

</body>
</html>
