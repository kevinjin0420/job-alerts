<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>job-alerts dashboard - sources</title>
<script>
  (function() {
    var stored = localStorage.getItem("job-alerts-theme");
    var isDark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.classList.toggle("dark", isDark);
  })();
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: "class" };</script>
<style>
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background-color: rgb(212 212 212); border-radius: 9999px; border: 2px solid transparent; background-clip: content-box; }
  html { scrollbar-color: rgb(212 212 212) transparent; scrollbar-width: thin; }
  @media (prefers-color-scheme: dark) {
    ::-webkit-scrollbar-thumb { background-color: rgb(64 64 64); }
    html { scrollbar-color: rgb(64 64 64) transparent; }
  }
</style>
</head>
<body class="bg-neutral-50 dark:bg-neutral-950 text-neutral-900 dark:text-neutral-100 min-h-screen">

<div id="gate" class="min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-sm rounded-none border border-neutral-300 dark:border-neutral-800 bg-white dark:bg-neutral-900 p-6">
    <h1 class="text-sm font-semibold tracking-wide uppercase text-center">job-alerts</h1>
    <p class="mt-1 text-sm text-neutral-500 dark:text-neutral-500 text-center">Sign in to continue</p>
    <div id="login-error" class="mt-3 text-sm hidden"></div>
    <input type="email" id="email-input" placeholder="Email"
      class="mt-4 w-full rounded-none border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-neutral-500">
    <input type="password" id="password-input" placeholder="Password"
      class="mt-3 w-full rounded-none border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-neutral-500">
    <input type="password" id="new-password-input" placeholder="New password"
      class="hidden mt-3 w-full rounded-none border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-neutral-500">
    <button id="login-btn"
      class="mt-3 w-full rounded-none bg-neutral-900 hover:opacity-50 dark:bg-neutral-100 text-white dark:text-neutral-900 text-sm font-medium px-3 py-1.5">
      Sign in
    </button>
  </div>
</div>

<div id="app" class="hidden flex min-h-screen">
__SIDEBAR__

  <main class="flex-1 p-6">
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-xs font-semibold tracking-widest uppercase text-neutral-500 dark:text-neutral-500">Companies</h2>
      <button id="refresh-btn"
        class="text-xs px-3 py-1.5 rounded-none border border-neutral-300 dark:border-neutral-700 hover:bg-neutral-100 dark:hover:bg-neutral-900">
        Refresh
      </button>
    </div>

    <div class="border border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-900 p-3 mb-6">
      <label class="block text-xs font-medium uppercase tracking-wide text-neutral-500 dark:text-neutral-500 mb-2">Add a company</label>
      <div class="grid sm:grid-cols-3 gap-3 mb-3">
        <input type="text" id="new-company-name" placeholder="Company name"
          class="rounded-none border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-neutral-500">
        <select id="new-company-kind" class="rounded-none border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-3 py-2 text-sm">
          <option value="community">Community filter only</option>
          <option value="greenhouse">Greenhouse-backed</option>
          <option value="ashby">Ashby-backed</option>
          <option value="direct">Direct scrape (own careers site)</option>
          <option value="zyte">Zyte-backed (paid, anti-bot bypass)</option>
        </select>
        <button id="add-company-btn"
          class="rounded-none bg-neutral-900 hover:opacity-50 dark:bg-neutral-100 text-white dark:text-neutral-900 text-sm font-medium px-3 py-1.5">
          Add
        </button>
      </div>
      <input type="text" id="new-company-token" placeholder="Greenhouse board token"
        class="hidden w-full mb-3 rounded-none border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-neutral-500">
      <input type="text" id="new-company-board-name" placeholder="Ashby board name (from jobs.ashbyhq.com/<board-name>)"
        class="hidden w-full mb-3 rounded-none border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-neutral-500">
      <div id="new-company-direct-fields" class="grid sm:grid-cols-3 gap-3 mb-3">
        <input type="text" id="new-company-intern-url" placeholder="Intern listings URL"
          class="rounded-none border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-neutral-500">
        <input type="text" id="new-company-newgrad-url" placeholder="New grad listings URL"
          class="rounded-none border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-neutral-500">
        <input type="text" id="new-company-fulltime-url" placeholder="Full-time listings URL"
          class="rounded-none border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-neutral-500">
      </div>
      <p class="text-xs text-neutral-500 dark:text-neutral-500 mb-2">If the source can't filter by role (e.g. greenhouse/ashby/community), use the same URL for all three.</p>
      <p id="add-company-status" class="mt-2 text-sm text-neutral-500 dark:text-neutral-500"></p>
    </div>

    <div id="companies-table" class="border border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-900"></div>
  </main>
</div>

<script src="/shared.js"></script>
<script>
async function showApp() {
  showAppShell();
  if (!(await requireAdmin())) return;
  loadCompanies();
}

document.getElementById("refresh-btn").addEventListener("click", () => {
  loadCompanies();
});

function renderMessage(container, text, extraClass) {
  container.innerHTML = `<div class="px-4 py-6 text-sm ${extraClass}">${text}</div>`;
}

document.getElementById("new-company-kind").addEventListener("change", (event) => {
  const kind = event.target.value;
  document.getElementById("new-company-token").classList.toggle("hidden", kind !== "greenhouse");
  document.getElementById("new-company-board-name").classList.toggle("hidden", kind !== "ashby");
});

document.getElementById("add-company-btn").addEventListener("click", async () => {
  const status = document.getElementById("add-company-status");
  const nameInput = document.getElementById("new-company-name");
  const name = nameInput.value.trim();
  if (!name) return;
  const sourceKind = document.getElementById("new-company-kind").value;
  status.textContent = "Adding...";
  try {
    await apiFetch("/api/admin/companies", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        company_name: name,
        source_kind: sourceKind,
        board_token: document.getElementById("new-company-token").value.trim(),
        board_name: document.getElementById("new-company-board-name").value.trim(),
        intern_url: document.getElementById("new-company-intern-url").value.trim(),
        newgrad_url: document.getElementById("new-company-newgrad-url").value.trim(),
        fulltime_url: document.getElementById("new-company-fulltime-url").value.trim(),
      }),
    });
    status.textContent = `Added ${name}`;
    nameInput.value = "";
    document.getElementById("new-company-token").value = "";
    document.getElementById("new-company-board-name").value = "";
    document.getElementById("new-company-intern-url").value = "";
    document.getElementById("new-company-newgrad-url").value = "";
    document.getElementById("new-company-fulltime-url").value = "";
    loadCompanies();
  } catch (error) {
    status.textContent = "Failed to add company";
  }
});

// A company's exact source_name isn't always knowable from the catalog alone -
// ashby/direct/zyte are parameterized per job_type, so a company only gets a
// concrete name once some user has actually selected a job_type for it (and
// may end up with multiple, one per job_type). Prefix matching handles that;
// greenhouse and the flat kinds (community/apple/google) have a single
// deterministic name, matched exactly.
function getCompanyHealthRows(company, healthSources) {
  const kind = company.source_kind;
  if (kind === "greenhouse" && company.board_token) {
    return healthSources.filter((s) => s.source_name === `greenhouse:${company.company_name}:${company.board_token}`);
  }
  if (kind === "ashby" && company.board_name) {
    return healthSources.filter((s) => s.source_name.startsWith(`ashby:${company.board_name}:`));
  }
  if (kind === "direct" || kind === "zyte") {
    return healthSources.filter((s) => s.source_name.startsWith(`${kind}:${company.company_name}:`));
  }
  if (kind === "community" || kind === "apple" || kind === "google") {
    return healthSources.filter((s) => s.source_name === kind);
  }
  return [];
}

function formatSuccessRate(successCount, failureCount) {
  const total = successCount + failureCount;
  return total === 0 ? "-" : `${Math.round((successCount / total) * 100)}%`;
}

async function loadCompanies() {
  const container = document.getElementById("companies-table");
  renderMessage(container, "Loading…", "text-neutral-500 dark:text-neutral-500");
  let companies, healthSources;
  try {
    const [companiesResponse, healthResponse] = await Promise.all([
      apiFetch("/api/admin/companies"),
      apiFetch("/api/admin/source-health"),
    ]);
    ({ companies } = await companiesResponse.json());
    ({ sources: healthSources } = await healthResponse.json());
  } catch (error) {
    renderMessage(container, "Failed to load companies", "text-red-600 dark:text-red-400");
    return;
  }
  if (companies.length === 0) {
    renderMessage(container, "No companies yet", "text-neutral-500 dark:text-neutral-500");
    return;
  }
  const table = document.createElement("table");
  table.className = "w-full text-sm";
  table.innerHTML = `
    <thead>
      <tr class="border-b border-neutral-200 dark:border-neutral-800 text-left text-xs uppercase tracking-wide text-neutral-500 dark:text-neutral-500">
        <th class="px-3 py-2 font-medium">Name</th>
        <th class="px-3 py-2 font-medium">Kind</th>
        <th class="px-3 py-2 font-medium">Job types</th>
        <th class="px-3 py-2 font-medium">Details</th>
        <th class="px-3 py-2 font-medium">Last success</th>
        <th class="px-3 py-2 font-medium">Last failure</th>
        <th class="px-3 py-2 font-medium">Success rate</th>
        <th class="px-3 py-2 font-medium"></th>
      </tr>
    </thead>
  `;
  const tbody = document.createElement("tbody");
  for (const company of companies) {
    const row = document.createElement("tr");
    row.className = "border-b border-neutral-100 dark:border-neutral-900 last:border-0";
    const jobTypes = ["intern_url", "newgrad_url", "fulltime_url"]
      .filter((field) => company[field])
      .map((field) => field.replace("_url", ""))
      .join(", ");

    const healthRows = getCompanyHealthRows(company, healthSources);
    const neverRun = healthRows.length === 0;
    const lastSuccessAt = neverRun ? null : Math.max(...healthRows.map((r) => r.last_success_at || 0)) || null;
    const lastFailureAt = neverRun ? null : Math.max(...healthRows.map((r) => r.last_failure_at || 0)) || null;
    const successCount = healthRows.reduce((sum, r) => sum + (r.success_count || 0), 0);
    const failureCount = healthRows.reduce((sum, r) => sum + (r.failure_count || 0), 0);
    const lastSuccess = neverRun ? "Never run" : lastSuccessAt ? new Date(lastSuccessAt * 1000).toISOString().replace(/\.\d{3}Z$/, "Z") : "-";
    const lastFailure = neverRun ? "Never run" : lastFailureAt ? new Date(lastFailureAt * 1000).toISOString().replace(/\.\d{3}Z$/, "Z") : "-";

    row.innerHTML = `
      <td class="px-3 py-2">${company.company_name}</td>
      <td class="px-3 py-2">${company.source_kind}</td>
      <td class="px-3 py-2 text-neutral-500 dark:text-neutral-500">${jobTypes || "-"}</td>
      <td class="px-3 py-2 font-mono text-xs text-neutral-500 dark:text-neutral-500">${company.board_token || company.board_name || "-"}</td>
      <td class="px-3 py-2 font-mono text-xs text-neutral-500 dark:text-neutral-500">${lastSuccess}</td>
      <td class="px-3 py-2 font-mono text-xs text-neutral-500 dark:text-neutral-500">${lastFailure}</td>
      <td class="px-3 py-2">${neverRun ? "-" : formatSuccessRate(successCount, failureCount)}</td>
      <td class="px-3 py-2 text-right"></td>
    `;
    const removeBtn = document.createElement("button");
    removeBtn.textContent = "Remove";
    removeBtn.className = "text-xs px-2 py-1 rounded-none border border-red-200 dark:border-red-900 text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-950";
    removeBtn.addEventListener("click", async () => {
      await apiFetch(`/api/admin/companies/${encodeURIComponent(company.company_name)}`, { method: "DELETE" });
      loadCompanies();
    });
    row.lastElementChild.appendChild(removeBtn);
    tbody.appendChild(row);
  }
  table.appendChild(tbody);
  container.innerHTML = "";
  container.appendChild(table);
}

if (token()) {
  showApp();
} else {
  showGate();
}
</script>

</body>
</html>
