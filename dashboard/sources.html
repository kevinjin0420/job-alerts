<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>job-alerts dashboard - sources</title>
<script>
  (function() {
    var stored = localStorage.getItem("job-alerts-theme");
    var isDark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.classList.toggle("dark", isDark);
  })();
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: "class" };</script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.15.12/dist/cdn.min.js"
  integrity="sha384-pb6hrQvo4s23cEUFtj0CZkzGE3jyK3pj26RIupXXxhSrrcUA/Cn0lZgcCrGH0t6L"
  crossorigin="anonymous"></script>
<style>
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background-color: rgb(212 212 212); border-radius: 9999px; border: 2px solid transparent; background-clip: content-box; }
  html { scrollbar-color: rgb(212 212 212) transparent; scrollbar-width: thin; }
  @media (prefers-color-scheme: dark) {
    ::-webkit-scrollbar-thumb { background-color: rgb(64 64 64); }
    html { scrollbar-color: rgb(64 64 64) transparent; }
  }
</style>
</head>
<body class="bg-neutral-50 dark:bg-neutral-950 text-neutral-900 dark:text-neutral-100 min-h-screen">

<div id="gate" class="min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-sm rounded-none border border-neutral-300 dark:border-neutral-800 bg-white dark:bg-neutral-900 p-6">
    <h1 class="text-sm font-semibold tracking-wide uppercase text-center">job-alerts</h1>
    <p class="mt-1 text-sm text-neutral-500 dark:text-neutral-500 text-center">Sign in to continue</p>
    <div id="login-error" class="mt-3 text-sm hidden"></div>
    <input type="email" id="email-input" placeholder="Email"
      class="mt-4 w-full rounded-none border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-neutral-500">
    <input type="password" id="password-input" placeholder="Password"
      class="mt-3 w-full rounded-none border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-neutral-500">
    <input type="password" id="new-password-input" placeholder="New password"
      class="hidden mt-3 w-full rounded-none border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-neutral-500">
    <button id="login-btn"
      class="mt-3 w-full rounded-none bg-neutral-900 hover:opacity-50 dark:bg-neutral-100 text-white dark:text-neutral-900 text-sm font-medium px-3 py-1.5">
      Sign in
    </button>
  </div>
</div>

<div id="app" class="hidden flex h-screen overflow-hidden">
__SIDEBAR__

  <main class="flex-1 p-6 flex flex-col min-h-0" x-data="sourcesPage()" x-init="init()">
    <div class="flex items-center justify-between mb-6 shrink-0">
      <h2 class="text-xs font-semibold tracking-widest uppercase text-neutral-500 dark:text-neutral-500">Companies</h2>
      <button @click="loadCompanies()"
        class="text-xs px-3 py-1.5 rounded-none border border-neutral-300 dark:border-neutral-700 hover:bg-neutral-100 dark:hover:bg-neutral-900">
        Refresh
      </button>
    </div>

    <div class="border border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-900 p-3 mb-6 shrink-0">
      <label class="block text-xs font-medium uppercase tracking-wide text-neutral-500 dark:text-neutral-500 mb-2">Add a company</label>
      <div class="grid sm:grid-cols-3 gap-3 mb-3">
        <input type="text" x-model.trim="newCompany.name" placeholder="Company name"
          class="rounded-none border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-neutral-500">
        <select x-model="newCompany.kind" class="rounded-none border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-3 py-2 text-sm">
          <option value="community">Community filter only</option>
          <option value="greenhouse">Greenhouse-backed</option>
          <option value="ashby">Ashby-backed</option>
          <option value="zyte">Zyte-backed (paid, anti-bot bypass)</option>
        </select>
        <button @click="addCompany()"
          class="rounded-none bg-neutral-900 hover:opacity-50 dark:bg-neutral-100 text-white dark:text-neutral-900 text-sm font-medium px-3 py-1.5">
          Add
        </button>
      </div>
      <input type="text" x-show="newCompany.kind === 'greenhouse'" x-model.trim="newCompany.boardToken" placeholder="Greenhouse board token"
        class="w-full mb-3 rounded-none border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-neutral-500">
      <input type="text" x-show="newCompany.kind === 'ashby'" x-model.trim="newCompany.boardName" placeholder="Ashby board name (from jobs.ashbyhq.com/<board-name>)"
        class="w-full mb-3 rounded-none border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-neutral-500">
      <div class="grid sm:grid-cols-3 gap-3 mb-3">
        <input type="text" x-model.trim="newCompany.internUrl" placeholder="Intern listings URL"
          class="rounded-none border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-neutral-500">
        <input type="text" x-model.trim="newCompany.newgradUrl" placeholder="New grad listings URL"
          class="rounded-none border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-neutral-500">
        <input type="text" x-model.trim="newCompany.fulltimeUrl" placeholder="Full-time listings URL"
          class="rounded-none border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-neutral-500">
      </div>
      <p class="text-xs text-neutral-500 dark:text-neutral-500 mb-2">If the source can't filter by role (e.g. greenhouse/ashby/community), use the same URL for all three.</p>
      <p class="mt-2 text-sm text-neutral-500 dark:text-neutral-500" x-text="addStatus"></p>
    </div>

    <div class="flex-1 min-h-0 border border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-900 overflow-y-auto overflow-x-hidden">
      <div x-show="loading" class="px-4 py-6 text-sm text-neutral-500 dark:text-neutral-500">Loading…</div>
      <div x-show="!loading && loadError" class="px-4 py-6 text-sm text-red-600 dark:text-red-400">Failed to load companies</div>
      <div x-show="!loading && !loadError && companies.length === 0" class="px-4 py-6 text-sm text-neutral-500 dark:text-neutral-500">No companies yet</div>
      <table x-show="!loading && !loadError && companies.length > 0" class="w-full table-fixed border-collapse text-sm">
        <thead>
          <tr class="sticky top-0 bg-white dark:bg-neutral-900 border-b border-neutral-200 dark:border-neutral-800 text-left text-xs uppercase tracking-wide text-neutral-500 dark:text-neutral-500">
            <th class="px-3 py-2 font-medium w-1/12">Name</th>
            <th class="px-3 py-2 font-medium w-3/12">Source</th>
            <th class="px-3 py-2 font-medium w-2/12">Job types</th>
            <th class="px-3 py-2 font-medium w-2/12">Last success</th>
            <th class="px-3 py-2 font-medium w-2/12">Last failure</th>
            <th class="px-3 py-2 font-medium w-1/12">Success rate</th>
            <th class="px-3 py-2 font-medium w-2/12"></th>
          </tr>
        </thead>
        <tbody>
          <template x-for="company in companies" :key="company.company_name">
            <tr class="border-b border-neutral-100 dark:border-neutral-900 last:border-0">
              <td class="px-3 py-2 break-words" x-text="company.company_name"></td>
              <td class="px-3 py-2 font-mono text-xs break-all" x-text="sourceLabel(company)"></td>
              <td class="px-3 py-2" x-text="jobTypesLabel(company)"></td>
              <td class="px-3 py-2 font-mono text-xs" x-text="lastSuccess(company)"></td>
              <td class="px-3 py-2 font-mono text-xs" x-text="lastFailure(company)"></td>
              <td class="px-3 py-2" x-text="successRate(company)"></td>
              <td class="px-3 py-2 text-right">
                <button @click="openModal(company)"
                  class="text-xs px-2 py-1 mr-2 rounded-none border border-neutral-300 dark:border-neutral-700 hover:bg-neutral-100 dark:hover:bg-neutral-900">
                  Config
                </button>
                <button @click="removeCompany(company)"
                  class="text-xs px-2 py-1 rounded-none border border-red-200 dark:border-red-900 text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-950">
                  Remove
                </button>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>

    <div x-show="modalCompany" class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4" @click.self="closeModal()">
      <div class="w-full max-w-lg rounded-none border border-neutral-300 dark:border-neutral-800 bg-white dark:bg-neutral-900 p-5">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-sm font-semibold" x-text="modalCompany ? `${modalCompany.company_name} - Source config` : ''"></h3>
          <button @click="closeModal()"
            class="text-xs px-2 py-1 rounded-none border border-neutral-300 dark:border-neutral-700 hover:bg-neutral-100 dark:hover:bg-neutral-900">
            Close
          </button>
        </div>
        <dl class="space-y-3">
          <template x-for="[label, value] in sourceConfigFields(modalCompany)" :key="label">
            <div>
              <dt class="text-xs uppercase tracking-wide text-neutral-500 dark:text-neutral-500 mb-1" x-text="label"></dt>
              <dd class="font-mono text-xs break-all" :class="value ? '' : 'text-neutral-400 dark:text-neutral-600'" x-text="value || 'not set'"></dd>
            </div>
          </template>
        </dl>
      </div>
    </div>
  </main>
</div>

<script src="/shared.js"></script>
<script>
function formatLocalDate(unixSeconds) {
  const date = new Date(unixSeconds * 1000);
  const pad = (n) => String(n).padStart(2, "0");
  return `${date.getFullYear()}/${pad(date.getMonth() + 1)}/${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
}

document.addEventListener("alpine:init", () => {
  Alpine.data("sourcesPage", () => ({
    companies: [],
    healthSources: [],
    loading: true,
    loadError: false,
    newCompany: { name: "", kind: "community", boardToken: "", boardName: "", internUrl: "", newgradUrl: "", fulltimeUrl: "" },
    addStatus: "",
    modalCompany: null,

    async init() {
      if (!token()) {
        showGate();
        return;
      }
      showAppShell();
      if (!(await requireAdmin())) return;
      await this.loadCompanies();
    },

    async loadCompanies() {
      this.loading = true;
      this.loadError = false;
      try {
        const [companiesResponse, healthResponse] = await Promise.all([
          apiFetch("/api/admin/companies"),
          apiFetch("/api/admin/source-health"),
        ]);
        ({ companies: this.companies } = await companiesResponse.json());
        ({ sources: this.healthSources } = await healthResponse.json());
      } catch (error) {
        this.loadError = true;
      }
      this.loading = false;
    },

    async addCompany() {
      const name = this.newCompany.name.trim();
      if (!name) return;
      this.addStatus = "Adding...";
      try {
        await apiFetch("/api/admin/companies", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            company_name: name,
            source_kind: this.newCompany.kind,
            board_token: this.newCompany.boardToken,
            board_name: this.newCompany.boardName,
            intern_url: this.newCompany.internUrl,
            newgrad_url: this.newCompany.newgradUrl,
            fulltime_url: this.newCompany.fulltimeUrl,
          }),
        });
        this.addStatus = `Added ${name}`;
        this.newCompany = { name: "", kind: "community", boardToken: "", boardName: "", internUrl: "", newgradUrl: "", fulltimeUrl: "" };
        await this.loadCompanies();
      } catch (error) {
        this.addStatus = "Failed to add company";
      }
    },

    async removeCompany(company) {
      await apiFetch(`/api/admin/companies/${encodeURIComponent(company.company_name)}`, { method: "DELETE" });
      await this.loadCompanies();
    },

    openModal(company) {
      this.modalCompany = company;
    },

    closeModal() {
      this.modalCompany = null;
    },

    // Every per-company source names itself "{kind}:{company_name}:{job_type}" (see sources/*.py); "community" is the one exception, a single shared source with no company suffix.
    getCompanyHealthRows(company) {
      const kind = company.source_kind;
      if (kind === "community") {
        return this.healthSources.filter((s) => s.source_name === kind);
      }
      return this.healthSources.filter((s) => s.source_name.startsWith(`${kind}:${company.company_name}:`));
    },

    // Matches the actual source_name prefix from getCompanyHealthRows.
    sourceLabel(company) {
      return company.source_kind === "community" ? company.source_kind : `${company.source_kind}:${company.company_name}`;
    },

    jobTypesLabel(company) {
      return ["intern_url", "newgrad_url", "fulltime_url"].filter((field) => company[field]).map((field) => field.replace("_url", "")).join(", ") || "-";
    },

    lastSuccess(company) {
      const rows = this.getCompanyHealthRows(company);
      if (rows.length === 0) return "Never run";
      const at = Math.max(...rows.map((r) => r.last_success_at || 0)) || null;
      return at ? formatLocalDate(at) : "-";
    },

    lastFailure(company) {
      const rows = this.getCompanyHealthRows(company);
      if (rows.length === 0) return "Never run";
      const at = Math.max(...rows.map((r) => r.last_failure_at || 0)) || null;
      return at ? formatLocalDate(at) : "-";
    },

    successRate(company) {
      const rows = this.getCompanyHealthRows(company);
      if (rows.length === 0) return "-";
      const successCount = rows.reduce((sum, r) => sum + (r.success_count || 0), 0);
      const failureCount = rows.reduce((sum, r) => sum + (r.failure_count || 0), 0);
      const total = successCount + failureCount;
      return total === 0 ? "-" : `${Math.round((successCount / total) * 100)}%`;
    },

    // Every kind shows the same four URL fields; Intern/New grad/Full-time fall back to General URL when the company has no distinct page (mirrors watch.py's _job_type_url).
    sourceConfigFields(company) {
      if (!company) return [];
      const kind = company.source_kind;
      const effective = (field) => company[field] || company.general_url;
      const urlFields = [
        ["Intern URL", effective("intern_url")],
        ["New grad URL", effective("newgrad_url")],
        ["Full-time URL", effective("fulltime_url")],
        ["General URL", company.general_url],
      ];
      if (kind === "greenhouse") {
        return [
          ...urlFields,
          ["Board token", company.board_token],
          ["API URL", company.board_token && `https://boards-api.greenhouse.io/v1/boards/${company.board_token}/jobs`],
        ];
      }
      if (kind === "ashby") {
        return [
          ...urlFields,
          ["Board name", company.board_name],
          ["API URL", company.board_name && `https://api.ashbyhq.com/posting-api/job-board/${company.board_name}`],
        ];
      }
      if (kind === "workday") {
        return [...urlFields, ["Board token", company.board_token]];
      }
      if (kind === "amazon") {
        return [...urlFields, ["Fetched via", "https://www.amazon.jobs/en/search.json (fixed, built into the source)"]];
      }
      if (kind === "oracle") {
        return [...urlFields, ["Fetched via", "Oracle Recruiting Cloud API (full-text search, title-filtered)"]];
      }
      if (kind === "sitemap") {
        return [...urlFields, ["Fetched via", "public sitemap.xml (titles approximated from URL slugs)"]];
      }
      if (kind === "zyte" || kind === "apple" || kind === "google") {
        return urlFields;
      }
      // community - single shared scraper, no per-company config at all
      return [["Config", "Built-in scraper, no per-company URL or token"]];
    },
  }));
});
</script>

</body>
</html>
