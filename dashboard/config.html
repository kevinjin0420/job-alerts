<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>job-alerts dashboard - config</title>
<script>
  (function() {
    var stored = localStorage.getItem("job-alerts-theme");
    var isDark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.classList.toggle("dark", isDark);
  })();
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: "class" };</script>
<style>
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background-color: rgb(212 212 212); border-radius: 9999px; border: 2px solid transparent; background-clip: content-box; }
  html { scrollbar-color: rgb(212 212 212) transparent; scrollbar-width: thin; }
  @media (prefers-color-scheme: dark) {
    ::-webkit-scrollbar-thumb { background-color: rgb(64 64 64); }
    html { scrollbar-color: rgb(64 64 64) transparent; }
  }
</style>
</head>
<body class="bg-neutral-50 dark:bg-neutral-950 text-neutral-900 dark:text-neutral-100 min-h-screen">

<div id="gate" class="min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-sm rounded-none border border-neutral-300 dark:border-neutral-800 bg-white dark:bg-neutral-900 p-6">
    <h1 class="text-sm font-semibold tracking-wide uppercase text-center">job-alerts</h1>
    <p class="mt-1 text-sm text-neutral-500 dark:text-neutral-500 text-center">Sign in to continue</p>
    <div id="login-error" class="mt-3 text-sm hidden"></div>
    <input type="email" id="email-input" placeholder="Email"
      class="mt-4 w-full rounded-none border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-neutral-500">
    <input type="password" id="password-input" placeholder="Password"
      class="mt-3 w-full rounded-none border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-neutral-500">
    <input type="password" id="new-password-input" placeholder="New password"
      class="hidden mt-3 w-full rounded-none border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-neutral-500">
    <button id="login-btn"
      class="mt-3 w-full rounded-none bg-neutral-900 hover:opacity-50 dark:bg-neutral-100 text-white dark:text-neutral-900 text-sm font-medium px-3 py-1.5">
      Sign in
    </button>
  </div>
</div>

<div id="app" class="hidden flex min-h-screen">
__SIDEBAR__

  <main class="flex-1 p-6">
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-xs font-semibold tracking-widest uppercase text-neutral-500 dark:text-neutral-500">Config</h2>
      <div class="flex items-center gap-3">
        <span id="status" class="text-sm text-neutral-500 dark:text-neutral-500"></span>
        <button id="save-config-btn"
          class="rounded-none bg-neutral-900 hover:opacity-50 dark:bg-neutral-100 text-white dark:text-neutral-900 text-sm font-medium px-3 py-1.5">
          Save config
        </button>
      </div>
    </div>

    <div class="grid lg:grid-cols-2 gap-6 items-start">
      <div class="space-y-6">
        <div class="border border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-900 p-3">
          <label class="block text-xs font-medium uppercase tracking-wide text-neutral-500 dark:text-neutral-500 mb-2">Fit prompt</label>
          <textarea id="fit-prompt" rows="22"
            class="w-full rounded-none border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-3 py-2 text-sm font-mono leading-6 focus:outline-none focus:ring-1 focus:ring-neutral-500"></textarea>
        </div>

        <div class="border border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-900 p-3">
          <label class="block text-xs font-medium uppercase tracking-wide text-neutral-500 dark:text-neutral-500 mb-2">Prompt tuner</label>
          <p class="text-sm text-neutral-500 dark:text-neutral-500 mb-3">Test the fit prompt above (and classifier model, right) against a sample listing before saving. Uses a real classifier call - counts against your monthly quota.</p>
          <div class="grid sm:grid-cols-2 gap-3 mb-3">
            <input type="text" id="tuner-company" placeholder="Company"
              class="rounded-none border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-neutral-500">
            <input type="text" id="tuner-title" placeholder="Title"
              class="rounded-none border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-neutral-500">
            <input type="text" id="tuner-locations" placeholder="Locations (comma separated)"
              class="sm:col-span-2 rounded-none border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-neutral-500">
          </div>
          <textarea id="tuner-description" rows="4" placeholder="Job description"
            class="w-full mb-3 rounded-none border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-neutral-500"></textarea>
          <button id="run-tuner-btn"
            class="rounded-none border border-neutral-300 dark:border-neutral-700 hover:bg-neutral-100 dark:hover:bg-neutral-900 text-sm font-medium px-3 py-1.5">
            Test
          </button>
          <div id="tuner-result" class="hidden mt-3 rounded-none border border-neutral-200 dark:border-neutral-700 px-3 py-2 text-sm"></div>
        </div>
      </div>

      <div class="space-y-6">
        <div class="border border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-900 p-3">
          <label class="block text-xs font-medium uppercase tracking-wide text-neutral-500 dark:text-neutral-500 mb-2">Companies</label>
          <input type="text" id="company-search" placeholder="Search companies…"
            class="w-full rounded-none border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-3 py-2 text-sm mb-3 focus:outline-none focus:ring-1 focus:ring-neutral-500">
          <div id="company-checkboxes"
            class="max-h-48 overflow-y-auto rounded-none border border-neutral-200 dark:border-neutral-700 divide-y divide-neutral-200 dark:divide-neutral-800"></div>
        </div>

        <div class="border border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-900 p-3">
          <label class="block text-xs font-medium uppercase tracking-wide text-neutral-500 dark:text-neutral-500 mb-2">Job types</label>
          <div id="job-type-checkboxes"
            class="rounded-none border border-neutral-200 dark:border-neutral-700 divide-y divide-neutral-200 dark:divide-neutral-800"></div>
        </div>

      </div>
    </div>
  </main>
</div>

<script src="/shared.js"></script>
<script>
async function showApp() {
  showAppShell();
  await setupNav();
  loadConfig();
}

document.getElementById("run-tuner-btn").addEventListener("click", async () => {
  const result = document.getElementById("tuner-result");
  result.classList.remove("hidden");
  result.className = "mt-3 rounded-none border border-neutral-200 dark:border-neutral-700 px-3 py-2 text-sm text-neutral-500 dark:text-neutral-500";
  result.textContent = "Testing…";
  const body = {
    fit_prompt: document.getElementById("fit-prompt").value,
    company_name: document.getElementById("tuner-company").value,
    title: document.getElementById("tuner-title").value,
    locations: document.getElementById("tuner-locations").value,
    description: document.getElementById("tuner-description").value,
  };
  try {
    const response = await apiFetch("/api/test-classifier", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await response.json();
    if (!response.ok) {
      result.className = "mt-3 rounded-none border border-neutral-200 dark:border-neutral-700 px-3 py-2 text-sm text-red-600 dark:text-red-400";
      result.textContent = data.error || "Test failed";
      return;
    }
    result.className = `mt-3 rounded-none border border-neutral-200 dark:border-neutral-700 px-3 py-2 text-sm ${data.fits ? "text-green-700 dark:text-green-400" : "text-red-600 dark:text-red-400"}`;
    result.textContent = `${data.fits ? "Fits" : "Dismissed"}: ${data.reason}`;
  } catch (error) {
    result.className = "mt-3 rounded-none border border-neutral-200 dark:border-neutral-700 px-3 py-2 text-sm text-red-600 dark:text-red-400";
    result.textContent = "Test failed";
  }
});

function renderCheckboxes(container, options, selected, idPrefix) {
  container.innerHTML = "";
  const selectedLower = new Set(selected.map((value) => value.toLowerCase()));
  for (const option of options) {
    const id = `${idPrefix}-${option.toLowerCase()}`;
    const row = document.createElement("label");
    row.className = "flex items-center gap-2 px-3 py-2 text-sm cursor-pointer hover:bg-neutral-50 dark:hover:bg-neutral-800";
    row.dataset.optionLabel = option.toLowerCase();
    row.innerHTML = `
      <input type="checkbox" id="${id}" value="${option}" class="rounded-none border-neutral-300 dark:border-neutral-700"
        ${selectedLower.has(option.toLowerCase()) ? "checked" : ""}>
      ${option}
    `;
    container.appendChild(row);
  }
}

function checkedValues(container) {
  return Array.from(container.querySelectorAll("input[type=checkbox]:checked")).map((input) => input.value);
}

document.getElementById("company-search").addEventListener("input", (event) => {
  const query = event.target.value.trim().toLowerCase();
  const container = document.getElementById("company-checkboxes");
  let anyVisible = false;
  for (const row of container.children) {
    if (row.dataset.optionLabel === undefined) continue;
    const matches = row.dataset.optionLabel.includes(query);
    row.classList.toggle("hidden", !matches);
    anyVisible = anyVisible || matches;
  }
  let emptyMessage = container.querySelector("[data-empty-message]");
  if (!anyVisible && !emptyMessage) {
    emptyMessage = document.createElement("div");
    emptyMessage.dataset.emptyMessage = "true";
    emptyMessage.className = "px-3 py-4 text-sm text-neutral-500 dark:text-neutral-500 text-center";
    emptyMessage.textContent = "No companies match your search";
    container.appendChild(emptyMessage);
  } else if (anyVisible && emptyMessage) {
    emptyMessage.remove();
  }
});

async function loadConfig() {
  const status = document.getElementById("status");
  status.textContent = "Loading config…";
  try {
    const [configResponse, optionsResponse] = await Promise.all([
      apiFetch("/api/config"),
      apiFetch("/api/options"),
    ]);
    const config = await configResponse.json();
    const options = await optionsResponse.json();
    document.getElementById("fit-prompt").value = config.fit_prompt || "";
    renderCheckboxes(document.getElementById("company-checkboxes"), options.companies, config.companies || [], "company");
    renderCheckboxes(document.getElementById("job-type-checkboxes"), options.job_types, config.job_types || ["intern"], "jobtype");
    status.textContent = "";
  } catch (error) {
    status.textContent = "Failed to load config";
  }
}

document.getElementById("save-config-btn").addEventListener("click", async () => {
  const status = document.getElementById("status");
  status.textContent = "Saving...";
  const body = {
    fit_prompt: document.getElementById("fit-prompt").value,
    companies: checkedValues(document.getElementById("company-checkboxes")),
    job_types: checkedValues(document.getElementById("job-type-checkboxes")),
  };
  try {
    await apiFetch("/api/config", { method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
    status.textContent = "Saved";
  } catch (error) {
    status.textContent = "Failed to save";
  }
  setTimeout(() => { status.textContent = ""; }, 3000);
});

if (token()) {
  showApp();
} else {
  showGate();
}
</script>

</body>
</html>
