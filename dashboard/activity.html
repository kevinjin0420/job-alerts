<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>job-alerts dashboard - activity</title>
<script>
  (function() {
    var stored = localStorage.getItem("job-alerts-theme");
    var isDark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.classList.toggle("dark", isDark);
  })();
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: "class" };</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"
  integrity="sha512-Y51n9mtKTVBh3Jbx5pZSJNDDMyY+yGe77DGtBPzRlgsf/YLCh13kSZ3JmfHGzYFCmOndraf0sQgfM654b7dJ3w=="
  crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background-color: rgb(212 212 212); border-radius: 9999px; border: 2px solid transparent; background-clip: content-box; }
  html { scrollbar-color: rgb(212 212 212) transparent; scrollbar-width: thin; }
  @media (prefers-color-scheme: dark) {
    ::-webkit-scrollbar-thumb { background-color: rgb(64 64 64); }
    html { scrollbar-color: rgb(64 64 64) transparent; }
  }

  /* 6 identity slots + neutral "Other" - a 7th (violet) failed the pie's wrap-around adjacency check (last slice touches first) in dark mode. */
  .viz-root {
    --chart-axis: #898781;
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --series-3: #1baf7a;
    --series-4: #eda100;
    --series-5: #e87ba4;
    --series-6: #008300;
    --series-other: #9a9890;
  }
  .dark .viz-root {
    --chart-axis: #898781;
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --series-5: #d55181;
    --series-6: #008300;
    --series-other: #6b6a64;
  }
</style>
</head>
<body class="bg-neutral-50 dark:bg-neutral-950 text-neutral-900 dark:text-neutral-100 min-h-screen">

<div id="gate" class="min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-sm rounded-none border border-neutral-300 dark:border-neutral-800 bg-white dark:bg-neutral-900 p-6">
    <h1 class="text-sm font-semibold tracking-wide uppercase text-center">job-alerts</h1>
    <p class="mt-1 text-sm text-neutral-500 dark:text-neutral-500 text-center">Sign in to continue</p>
    <div id="login-error" class="mt-3 text-sm hidden"></div>
    <input type="email" id="email-input" placeholder="Email"
      class="mt-4 w-full rounded-none border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-neutral-500">
    <input type="password" id="password-input" placeholder="Password"
      class="mt-3 w-full rounded-none border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-neutral-500">
    <input type="password" id="new-password-input" placeholder="New password"
      class="hidden mt-3 w-full rounded-none border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-neutral-500">
    <button id="login-btn"
      class="mt-3 w-full rounded-none bg-neutral-900 hover:opacity-50 dark:bg-neutral-100 text-white dark:text-neutral-900 text-sm font-medium px-3 py-1.5">
      Sign in
    </button>
  </div>
</div>

<div id="app" class="hidden flex h-screen overflow-hidden">
__SIDEBAR__

  <main class="flex-1 p-6 flex flex-col min-h-0">
    <div class="flex items-baseline justify-between mb-6">
      <h2 id="activity-heading" class="text-xs font-semibold tracking-widest uppercase text-neutral-500 dark:text-neutral-500">Activity &middot; last 24h</h2>
      <div class="flex items-center gap-3">
        <select id="range-select"
          class="text-xs px-2 py-1.5 rounded-none border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-900 focus:outline-none focus:ring-1 focus:ring-neutral-500"></select>
        <button id="refresh-btn"
          class="text-xs px-3 py-1.5 rounded-none border border-neutral-300 dark:border-neutral-700 hover:bg-neutral-100 dark:hover:bg-neutral-900">
          Refresh
        </button>
      </div>
    </div>

    <div class="grid gap-6 xl:grid-cols-2 mb-8">
      <figure id="chart-token-usage" class="viz-root border border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-900 px-4 py-4"></figure>
      <figure id="chart-notifications" class="viz-root border border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-900 px-4 py-4"></figure>
    </div>

    <h3 class="text-xs font-semibold tracking-widest uppercase text-neutral-500 dark:text-neutral-500 mb-3">Notifications sent</h3>
    <div class="flex items-center gap-3 mb-3">
      <input type="text" id="notification-search" placeholder="Search company or title…"
        class="flex-1 rounded-none border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-neutral-500">
      <select id="user-filter"
        class="text-sm px-2 py-2 rounded-none border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-900 focus:outline-none focus:ring-1 focus:ring-neutral-500"></select>
    </div>
    <div class="flex-1 min-h-0 border border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-900 overflow-y-auto">
      <table class="w-full table-fixed border-collapse text-sm">
        <thead>
          <tr class="sticky top-0 bg-white dark:bg-neutral-900 border-b border-neutral-200 dark:border-neutral-800 text-left text-xs uppercase tracking-wide text-neutral-500 dark:text-neutral-500">
            <th class="px-3 py-2 font-medium w-3/12">User</th>
            <th class="px-3 py-2 font-medium w-2/12">Company</th>
            <th class="px-3 py-2 font-medium w-4/12">Title</th>
            <th class="px-3 py-2 font-medium w-1/12">Fit score</th>
            <th class="px-3 py-2 font-medium w-2/12">Sent at</th>
          </tr>
        </thead>
        <tbody id="notifications-tbody"></tbody>
      </table>
    </div>
  </main>
</div>

<script src="/shared.js"></script>
<script>
// Mirrors dashboard/app.py's METRICS_RANGE_PRESETS_MINUTES - keep both in sync.
const RANGE_OPTIONS = [
  { value: "5m", label: "5 minutes", minutes: 5 },
  { value: "10m", label: "10 minutes", minutes: 10 },
  { value: "15m", label: "15 minutes", minutes: 15 },
  { value: "30m", label: "30 minutes", minutes: 30 },
  { value: "1h", label: "1 hour", minutes: 60 },
  { value: "2h", label: "2 hours", minutes: 120 },
  { value: "3h", label: "3 hours", minutes: 180 },
  { value: "6h", label: "6 hours", minutes: 360 },
  { value: "12h", label: "12 hours", minutes: 720 },
  { value: "24h", label: "24 hours", minutes: 1440 },
  { value: "2d", label: "2 days", minutes: 2880 },
  { value: "3d", label: "3 days", minutes: 4320 },
  { value: "1w", label: "1 week", minutes: 10080 },
];
const DEFAULT_RANGE = "24h";
const RANGE_STORAGE_KEY = "job-alerts-activity-range";

function populateRangeSelect() {
  const select = document.getElementById("range-select");
  select.innerHTML = "";
  for (const option of RANGE_OPTIONS) {
    const el = document.createElement("option");
    el.value = option.value;
    el.textContent = `Last ${option.label}`;
    select.appendChild(el);
  }
  const stored = localStorage.getItem(RANGE_STORAGE_KEY);
  select.value = RANGE_OPTIONS.some((option) => option.value === stored) ? stored : DEFAULT_RANGE;
}

function currentRange() {
  const selected = document.getElementById("range-select").value;
  return RANGE_OPTIONS.find((option) => option.value === selected) || RANGE_OPTIONS.find((option) => option.value === DEFAULT_RANGE);
}

function updateActivityHeading() {
  document.getElementById("activity-heading").textContent = `Activity · last ${currentRange().label}`;
}

populateRangeSelect();
updateActivityHeading();

document.getElementById("range-select").addEventListener("change", () => {
  localStorage.setItem(RANGE_STORAGE_KEY, document.getElementById("range-select").value);
  updateActivityHeading();
  if (token()) loadActivity();
});

function formatLocalDate(value) {
  const date = new Date(value);
  const pad = (n) => String(n).padStart(2, "0");
  return `${date.getFullYear()}/${pad(date.getMonth() + 1)}/${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
}

async function showApp() {
  showAppShell();
  if (!(await requireAdmin())) return;
  loadActivity();
}

document.getElementById("refresh-btn").addEventListener("click", loadActivity);

function renderMessage(container, text, extraClass) {
  container.innerHTML = `<div class="border border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-900 px-4 py-6 text-sm ${extraClass}">${text}</div>`;
}

function chartColors() {
  const styles = getComputedStyle(document.querySelector(".viz-root"));
  return {
    axis: styles.getPropertyValue("--chart-axis").trim(),
    slots: [1, 2, 3, 4, 5, 6].map((n) => styles.getPropertyValue(`--series-${n}`).trim()),
    other: styles.getPropertyValue("--series-other").trim(),
  };
}

const UNKNOWN_USER_ID = "unknown";
const UNKNOWN_USER_LABEL = "Unknown (before per-user tracking)";

// Fixed alphabetical order so a user keeps the same color across both charts and reloads (identity, not rank, decides color).
function buildUserColorMap(allUserIds) {
  const colors = chartColors();
  const sorted = Array.from(new Set(allUserIds))
    .filter((id) => id !== UNKNOWN_USER_ID)
    .sort((a, b) => a.localeCompare(b));
  const map = new Map();
  sorted.forEach((userId, index) => {
    map.set(userId, index < colors.slots.length ? colors.slots[index] : colors.other);
  });
  map.set(UNKNOWN_USER_ID, colors.other);
  return map;
}

function userLabel(userId) {
  return userId === UNKNOWN_USER_ID ? UNKNOWN_USER_LABEL : userId;
}

// Beyond maxIndividual, fold into "Other" rather than cycling the palette.
function foldIntoTopSlices(rows, valueKey, maxIndividual = 6) {
  const sorted = [...rows].sort((a, b) => b[valueKey] - a[valueKey]);
  const top = sorted.slice(0, maxIndividual);
  const rest = sorted.slice(maxIndividual);
  const otherTotal = rest.reduce((sum, row) => sum + row[valueKey], 0);
  return otherTotal > 0 ? [...top, { user_id: "__other__", [valueKey]: otherTotal, isOther: true }] : top;
}

const chartInstances = {};

function buildPieTableView(rows, valueKey, valueLabel, formatValue) {
  const table = document.createElement("table");
  table.className = "w-full text-xs";
  table.innerHTML = `<thead><tr>
    <th class="text-left font-medium text-neutral-500 dark:text-neutral-500 pb-2 pr-4">User</th>
    <th class="text-right font-medium text-neutral-500 dark:text-neutral-500 pb-2 pl-4">${valueLabel}</th>
  </tr></thead>`;
  const tbody = document.createElement("tbody");
  for (const row of rows) {
    const tr = document.createElement("tr");
    const userCell = document.createElement("td");
    userCell.className = "py-1 pr-4";
    userCell.textContent = row.isOther ? "Other" : userLabel(row.user_id);
    const valueCell = document.createElement("td");
    valueCell.className = "py-1 pl-4 text-right font-mono";
    valueCell.textContent = formatValue(row[valueKey]);
    tr.append(userCell, valueCell);
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  return table;
}

function renderPieCard(id, title, rows, valueKey, valueLabel, colorMap, formatValue) {
  const figureEl = document.getElementById(id);
  figureEl.innerHTML = "";
  if (chartInstances[id]) {
    chartInstances[id].destroy();
    delete chartInstances[id];
  }

  const header = document.createElement("div");
  header.className = "flex items-center justify-between mb-3";
  const heading = document.createElement("h4");
  heading.className = "text-xs font-semibold tracking-widest uppercase text-neutral-500 dark:text-neutral-500";
  heading.textContent = title;
  header.appendChild(heading);
  figureEl.appendChild(header);

  const sliced = foldIntoTopSlices(rows.filter((row) => row[valueKey] > 0), valueKey);
  if (sliced.length === 0) {
    const empty = document.createElement("div");
    empty.className = "text-sm text-neutral-500 dark:text-neutral-500 py-6";
    empty.textContent = "No data in the selected window";
    figureEl.appendChild(empty);
    return;
  }

  const colors = chartColors();
  const toggle = document.createElement("button");
  toggle.type = "button";
  toggle.className = "text-xs px-2 py-1 rounded-none border border-neutral-300 dark:border-neutral-700 hover:bg-neutral-100 dark:hover:bg-neutral-900";
  toggle.textContent = "View as table";
  header.appendChild(toggle);

  const canvasWrapper = document.createElement("div");
  canvasWrapper.className = "h-64";
  const canvas = document.createElement("canvas");
  canvasWrapper.appendChild(canvas);
  figureEl.appendChild(canvasWrapper);

  const tableWrapper = document.createElement("div");
  tableWrapper.className = "hidden overflow-x-auto";
  tableWrapper.appendChild(buildPieTableView(sliced, valueKey, valueLabel, formatValue));
  figureEl.appendChild(tableWrapper);

  let showingTable = false;
  toggle.addEventListener("click", () => {
    showingTable = !showingTable;
    canvasWrapper.classList.toggle("hidden", showingTable);
    tableWrapper.classList.toggle("hidden", !showingTable);
    toggle.textContent = showingTable ? "View as chart" : "View as table";
  });

  const labels = sliced.map((row) => (row.isOther ? "Other" : userLabel(row.user_id)));
  const sliceColors = sliced.map((row) => (row.isOther ? colors.other : colorMap.get(row.user_id) || colors.other));

  chartInstances[id] = new Chart(canvas, {
    type: "pie",
    data: {
      labels,
      datasets: [
        {
          data: sliced.map((row) => row[valueKey]),
          backgroundColor: sliceColors,
          borderColor: sliceColors,
          borderWidth: 2,
        },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: "right", labels: { color: colors.axis, usePointStyle: true, boxWidth: 8 } },
        tooltip: {
          usePointStyle: true,
          callbacks: { label: (item) => `${formatValue(item.parsed)}  ${item.label}` },
        },
      },
    },
  });
}

function flattenNotifications(notificationsByUser) {
  const rows = [];
  for (const entry of notificationsByUser) {
    for (const notification of entry.notifications) {
      rows.push({ user_id: entry.user_id, ...notification });
    }
  }
  rows.sort((a, b) => b.seen_at - a.seen_at);
  return rows;
}

let allNotificationRows = [];

function populateUserFilter(userIds) {
  const select = document.getElementById("user-filter");
  const previous = select.value;
  select.innerHTML = '<option value="">All users</option>';
  for (const userId of userIds) {
    const el = document.createElement("option");
    el.value = userId;
    el.textContent = userLabel(userId);
    select.appendChild(el);
  }
  if (Array.from(select.options).some((option) => option.value === previous)) {
    select.value = previous;
  }
}

function renderNotificationsTable() {
  const tbody = document.getElementById("notifications-tbody");
  const query = document.getElementById("notification-search").value.trim().toLowerCase();
  const userFilter = document.getElementById("user-filter").value;
  const rows = allNotificationRows.filter((row) => {
    if (userFilter && row.user_id !== userFilter) return false;
    if (!query) return true;
    return `${row.company_name} ${row.title}`.toLowerCase().includes(query);
  });

  tbody.innerHTML = "";
  if (rows.length === 0) {
    tbody.innerHTML = `<tr><td colspan="5" class="px-4 py-6 text-sm text-neutral-500 dark:text-neutral-500">No notifications match</td></tr>`;
    return;
  }
  for (const row of rows) {
    const tr = document.createElement("tr");
    tr.className = "border-b border-neutral-100 dark:border-neutral-900 last:border-0";

    const userCell = document.createElement("td");
    userCell.className = "px-3 py-2 align-middle break-words";
    userCell.textContent = userLabel(row.user_id);

    const companyCell = document.createElement("td");
    companyCell.className = "px-3 py-2 align-middle break-words";
    companyCell.textContent = row.company_name || "-";

    // Scraped, untrusted data - textContent/properties only, never innerHTML.
    const titleCell = document.createElement("td");
    titleCell.className = "px-3 py-2 align-middle break-words";
    if (row.url) {
      const link = document.createElement("a");
      link.href = row.url;
      link.target = "_blank";
      link.rel = "noopener";
      link.className = "hover:underline";
      link.textContent = row.title || "-";
      titleCell.appendChild(link);
    } else {
      titleCell.textContent = row.title || "-";
    }

    const fitScoreCell = document.createElement("td");
    fitScoreCell.className = "px-3 py-2 align-middle font-mono text-xs";
    fitScoreCell.textContent = row.fit_score ?? "-";

    const seenAtCell = document.createElement("td");
    seenAtCell.className = "px-3 py-2 align-middle font-mono text-xs";
    seenAtCell.textContent = row.seen_at ? formatLocalDate(row.seen_at * 1000) : "-";

    tr.append(userCell, companyCell, titleCell, fitScoreCell, seenAtCell);
    tbody.appendChild(tr);
  }
}

document.getElementById("notification-search").addEventListener("input", renderNotificationsTable);
document.getElementById("user-filter").addEventListener("change", renderNotificationsTable);

async function loadActivity() {
  const range = currentRange();
  let data;
  try {
    const response = await apiFetch(`/api/admin/activity?range=${encodeURIComponent(range.value)}`);
    data = await response.json();
  } catch (error) {
    renderMessage(document.getElementById("chart-token-usage"), "Failed to load activity", "text-red-600 dark:text-red-400");
    document.getElementById("chart-notifications").innerHTML = "";
    return;
  }

  const tokenRows = data.token_usage_by_user || [];
  const notificationsByUser = data.notifications_by_user || [];
  allNotificationRows = flattenNotifications(notificationsByUser);
  const notificationCountRows = notificationsByUser.map((entry) => ({
    user_id: entry.user_id,
    count: entry.notifications.length,
  }));

  const allUserIds = new Set([
    ...tokenRows.map((row) => row.user_id),
    ...notificationCountRows.map((row) => row.user_id),
  ]);
  const colorMap = buildUserColorMap(allUserIds);

  renderPieCard(
    "chart-token-usage", "Token usage by user",
    tokenRows.map((row) => ({ user_id: row.user_id, tokens: row.input_tokens + row.output_tokens })),
    "tokens", "Tokens", colorMap, (value) => Math.round(value).toLocaleString(),
  );
  renderPieCard(
    "chart-notifications", "Notifications sent by user",
    notificationCountRows,
    "count", "Notifications", colorMap, (value) => Math.round(value).toLocaleString(),
  );

  populateUserFilter(Array.from(new Set(allNotificationRows.map((row) => row.user_id))).sort((a, b) => a.localeCompare(b)));
  renderNotificationsTable();
}

if (token()) {
  showApp();
} else {
  showGate();
}

setInterval(() => { if (token()) loadActivity(); }, 60000);

document.getElementById("theme-toggle-btn").addEventListener("click", () => {
  if (token()) loadActivity();
});
</script>

</body>
</html>
