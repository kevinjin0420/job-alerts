<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>job-alerts dashboard - listings</title>
<script>
  (function() {
    var stored = localStorage.getItem("job-alerts-theme");
    var isDark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.classList.toggle("dark", isDark);
  })();
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: "class" };</script>
<style>
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background-color: rgb(212 212 212); border-radius: 9999px; border: 2px solid transparent; background-clip: content-box; }
  html { scrollbar-color: rgb(212 212 212) transparent; scrollbar-width: thin; }
  @media (prefers-color-scheme: dark) {
    ::-webkit-scrollbar-thumb { background-color: rgb(64 64 64); }
    html { scrollbar-color: rgb(64 64 64) transparent; }
  }
</style>
</head>
<body class="bg-neutral-50 dark:bg-neutral-950 text-neutral-900 dark:text-neutral-100 min-h-screen">

<div id="gate" class="min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-sm rounded-none border border-neutral-300 dark:border-neutral-800 bg-white dark:bg-neutral-900 p-6">
    <h1 class="text-sm font-semibold tracking-wide uppercase text-center">job-alerts</h1>
    <p class="mt-1 text-sm text-neutral-500 dark:text-neutral-500 text-center">Sign in to continue</p>
    <div id="login-error" class="mt-3 text-sm hidden"></div>
    <input type="email" id="email-input" placeholder="Email"
      class="mt-4 w-full rounded-none border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-neutral-500">
    <input type="password" id="password-input" placeholder="Password"
      class="mt-3 w-full rounded-none border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-neutral-500">
    <input type="password" id="new-password-input" placeholder="New password"
      class="hidden mt-3 w-full rounded-none border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-neutral-500">
    <button id="login-btn"
      class="mt-3 w-full rounded-none bg-neutral-900 hover:opacity-50 dark:bg-neutral-100 text-white dark:text-neutral-900 text-sm font-medium px-3 py-1.5">
      Sign in
    </button>
  </div>
</div>

<div id="app" class="hidden flex min-h-screen">
__SIDEBAR__

  <main class="flex-1 p-6">
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-xs font-semibold tracking-widest uppercase text-neutral-500 dark:text-neutral-500">Listings</h2>
      <div class="flex items-center gap-4">
        <button id="refresh-btn"
          class="text-xs px-3 py-1.5 rounded-none border border-neutral-300 dark:border-neutral-700 hover:bg-neutral-100 dark:hover:bg-neutral-900">
          Refresh
        </button>
      </div>
    </div>

    <div id="listings-table" class="border border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-900 max-h-[calc(100vh-160px)] overflow-y-auto overflow-x-hidden"></div>
  </main>
</div>

<script src="/shared.js"></script>
<script>
let allListings = [];
const columnFilters = { company: "", title: "", status: "", fit_score: "" };

function formatLocalDate(value) {
  const date = new Date(value * 1000);
  const pad = (n) => String(n).padStart(2, "0");
  return `${date.getFullYear()}/${pad(date.getMonth() + 1)}/${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
}

async function showApp() {
  showAppShell();
  await setupNav();
  loadListings();
}

document.getElementById("refresh-btn").addEventListener("click", loadListings);

function renderMessage(container, text, extraClass) {
  container.innerHTML = `<div class="px-4 py-6 text-sm ${extraClass}">${text}</div>`;
}

const STATUS_STYLES = {
  notified: "text-green-700 dark:text-green-400",
  dismissed: "text-red-600 dark:text-red-400",
  seeded: "text-neutral-500 dark:text-neutral-500",
};

// Accepts a bare number ("90" -> exactly 90) or a number prefixed with a
// comparison operator (">=90", "<90"); anything else disables the filter.
function parseFitScoreFilter(raw) {
  const match = raw.match(/^\s*(>=|<=|>|<|=)?\s*(\d+)\s*$/);
  if (!match) return null;
  return { op: match[1] || "=", value: Number(match[2]) };
}

function getFilteredListings() {
  const fitFilter = columnFilters.fit_score ? parseFitScoreFilter(columnFilters.fit_score) : null;
  return allListings.filter((item) => {
    if (columnFilters.status && item.status !== columnFilters.status) return false;
    if (columnFilters.company && !(item.company_name || "").toLowerCase().includes(columnFilters.company)) return false;
    if (columnFilters.title && !(item.title || "").toLowerCase().includes(columnFilters.title)) return false;
    if (fitFilter) {
      if (item.fit_score === null || item.fit_score === undefined) return false;
      const score = Number(item.fit_score);
      if (fitFilter.op === ">=" && !(score >= fitFilter.value)) return false;
      if (fitFilter.op === "<=" && !(score <= fitFilter.value)) return false;
      if (fitFilter.op === ">" && !(score > fitFilter.value)) return false;
      if (fitFilter.op === "<" && !(score < fitFilter.value)) return false;
      if (fitFilter.op === "=" && !(score === fitFilter.value)) return false;
    }
    return true;
  });
}

function buildRow(item) {
  const row = document.createElement("tr");
  row.className = "border-b border-neutral-200 dark:border-neutral-800 last:border-0";
  const title = item.title || "(unknown - seen before this tracking existed)";
  const titleCell = item.url ? `<a href="${item.url}" target="_blank" class="hover:underline">${title}</a>` : title;
  row.innerHTML = `
    <td class="px-3 py-2 align-middle break-words">${item.company_name || "-"}</td>
    <td class="px-3 py-2 align-middle break-words">
      <div class="min-h-[2.5rem] flex items-center"><span class="line-clamp-2">${titleCell}</span></div>
    </td>
    <td class="px-3 py-2 align-middle break-words font-mono text-xs">${item.source || "-"}</td>
    <td class="px-3 py-2 align-middle ${STATUS_STYLES[item.status] || ""}">${item.status || "legacy"}</td>
    <td class="px-3 py-2 align-middle break-words">
      <div class="min-h-[2.5rem] flex items-center"><span class="line-clamp-2">${item.reason || "-"}</span></div>
    </td>
    <td class="px-3 py-2 align-middle font-mono text-xs">${item.fit_score ?? "-"}</td>
    <td class="px-3 py-2 align-middle font-mono text-xs">${item.seen_at ? formatLocalDate(item.seen_at) : "-"}</td>
    <td class="px-3 py-2 align-middle text-right"></td>
  `;
  if (item.status === "dismissed") {
    const retryBtn = document.createElement("button");
    retryBtn.textContent = "Retry";
    retryBtn.className = "text-xs px-2 py-1 rounded-none border border-neutral-300 dark:border-neutral-700 text-neutral-600 dark:text-neutral-400 hover:bg-neutral-100 dark:hover:bg-neutral-900";
    retryBtn.addEventListener("click", () => retryListing(item.listing_id));
    row.lastElementChild.appendChild(retryBtn);
  }
  return row;
}

function renderRows() {
  const tbody = document.getElementById("listings-tbody");
  if (!tbody) return;
  const listings = getFilteredListings();
  tbody.innerHTML = "";
  if (listings.length === 0) {
    tbody.innerHTML = `<tr><td colspan="8" class="px-4 py-6 text-sm text-neutral-500 dark:text-neutral-500">No listings match</td></tr>`;
    return;
  }
  for (const item of listings) {
    tbody.appendChild(buildRow(item));
  }
}

function columnFilterInput(key, placeholder) {
  return `<input type="text" data-filter-key="${key}" placeholder="${placeholder || "Filter…"}"
    class="w-full rounded-none border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-2 py-1 text-xs font-normal normal-case tracking-normal text-neutral-900 dark:text-neutral-100 focus:outline-none focus:ring-1 focus:ring-neutral-500">`;
}

function columnFilterSelect(key, options) {
  const optionTags = options.map(([value, label]) => `<option value="${value}">${label}</option>`).join("");
  return `<select data-filter-key="${key}"
    class="w-full rounded-none border border-neutral-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 px-2 py-1 text-xs font-normal normal-case tracking-normal text-neutral-900 dark:text-neutral-100 focus:outline-none focus:ring-1 focus:ring-neutral-500">${optionTags}</select>`;
}

function renderListings() {
  const container = document.getElementById("listings-table");
  if (allListings.length === 0) {
    renderMessage(container, "No listings yet", "text-neutral-500 dark:text-neutral-500");
    return;
  }

  const table = document.createElement("table");
  table.className = "w-full table-fixed border-collapse text-sm";
  table.innerHTML = `
    <thead class="sticky top-0 z-10 bg-white dark:bg-neutral-900">
      <tr class="text-left text-xs uppercase tracking-wide text-neutral-500 dark:text-neutral-500">
        <th class="px-3 py-2 font-medium w-1/12">Company</th>
        <th class="px-3 py-2 font-medium w-2/12">Title</th>
        <th class="px-3 py-2 font-medium w-1/12">Source</th>
        <th class="px-3 py-2 font-medium w-1/12">Status</th>
        <th class="px-3 py-2 font-medium w-4/12">Reason</th>
        <th class="px-3 py-2 font-medium w-1/12">Fit score</th>
        <th class="px-3 py-2 font-medium w-1/12">Seen</th>
        <th class="px-3 py-2 font-medium w-1/12"></th>
      </tr>
      <tr class="border-b border-neutral-200 dark:border-neutral-800">
        <th class="px-2 py-1.5">${columnFilterInput("company")}</th>
        <th class="px-2 py-1.5">${columnFilterInput("title")}</th>
        <th class="px-2 py-1.5"></th>
        <th class="px-2 py-1.5">${columnFilterSelect("status", [
          ["", "None"],
          ["notified", "Notified"],
          ["dismissed", "Dismissed"],
          ["seeded", "Seeded"],
        ])}</th>
        <th class="px-2 py-1.5"></th>
        <th class="px-2 py-1.5">${columnFilterInput("fit_score", ">=90")}</th>
        <th class="px-2 py-1.5"></th>
        <th class="px-2 py-1.5"></th>
      </tr>
    </thead>
    <tbody id="listings-tbody"></tbody>
  `;
  container.innerHTML = "";
  container.appendChild(table);

  for (const field of table.querySelectorAll("[data-filter-key]")) {
    field.value = columnFilters[field.dataset.filterKey];
    const eventName = field.tagName === "SELECT" ? "change" : "input";
    field.addEventListener(eventName, () => {
      columnFilters[field.dataset.filterKey] = field.tagName === "SELECT" ? field.value : field.value.toLowerCase();
      renderRows();
    });
  }
  renderRows();
}

async function loadListings() {
  const container = document.getElementById("listings-table");
  renderMessage(container, "Loading…", "text-neutral-500 dark:text-neutral-500");
  try {
    const response = await apiFetch("/api/listings");
    ({ listings: allListings } = await response.json());
  } catch (error) {
    renderMessage(container, "Failed to load listings", "text-red-600 dark:text-red-400");
    return;
  }
  renderListings();
}

async function retryListing(listingId) {
  await apiFetch(`/api/listings/${encodeURIComponent(listingId)}`, { method: "DELETE" });
  loadListings();
}

if (token()) {
  showApp();
} else {
  showGate();
}
</script>

</body>
</html>
